# ① HTTP → 仅用于 ACME challenge 和重定向
server {
    listen 80;
    server_name elecone.chat www.elecone.chat;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ② HTTPS
server {
    listen 443 ssl;
    server_name elecone.chat www.elecone.chat;

    ssl_certificate     /etc/letsencrypt/live/elecone.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elecone.chat/privkey.pem;

    # 推荐安全参数
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传文件大小限制
    client_max_body_size 100M;

    # 后端 API
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / 流式响应
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # 前端
    location / {
        proxy_pass         http://frontend:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
